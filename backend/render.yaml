# Render Blueprint for Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tiet-medicare-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false  # Set this manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: ALLOWED_ORIGINS
        sync: false  # Set to your Vercel/Netlify frontend URL
